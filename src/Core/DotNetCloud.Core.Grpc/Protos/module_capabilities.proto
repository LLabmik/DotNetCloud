syntax = "proto3";

option csharp_namespace = "DotNetCloud.Core.Grpc.Capabilities";

package dotnetcloud.capabilities;

// CoreCapabilities service: hosted by the core server.
// Modules call this service to access platform capabilities (IUserDirectory,
// INotificationService, IEventBus, etc.) via gRPC.
service CoreCapabilities {
  // Looks up public user information by user ID.
  rpc GetUser (GetUserRequest) returns (GetUserResponse);

  // Searches for users matching specified criteria.
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse);

  // Gets the current caller's context and identity information.
  rpc GetCurrentUser (GetCurrentUserRequest) returns (GetCurrentUserResponse);

  // Sends a notification to one or more users.
  rpc SendNotification (SendNotificationRequest) returns (SendNotificationResponse);

  // Publishes an event on the event bus.
  rpc PublishEvent (PublishEventRequest) returns (PublishEventResponse);

  // Reads a module-specific setting value.
  rpc GetSetting (GetSettingRequest) returns (GetSettingResponse);

  // Writes a module-specific setting value.
  rpc SetSetting (SetSettingRequest) returns (SetSettingResponse);

  // Triggers cleanup of orphaned media sources and entities when an admin
  // shared folder is deleted. Called by the Files module host.
  rpc CleanupAdminSharedFolder (CleanupAdminSharedFolderRequest) returns (CleanupAdminSharedFolderResponse);

  // Gets basic group information by ID (IGroupDirectory capability).
  rpc GetGroup (GetGroupRequest) returns (GetGroupResponse);

  // Broadcasts a real-time event to connected SignalR clients.
  // Called by process-isolated module hosts that need to push real-time
  // events (new messages, typing indicators, etc.) to web/mobile clients
  // connected via Core.Server's SignalR hubs.
  rpc BroadcastRealtimeEvent (BroadcastRealtimeEventRequest) returns (BroadcastRealtimeEventResponse);

  // Records an audit trail entry (IAuditLogger capability, SOC 2 CC4).
  rpc LogAudit (LogAuditRequest) returns (LogAuditResponse);

  // Submits a search-index request from a process-isolated module (real-time indexing).
  rpc SubmitSearchIndex (SubmitSearchIndexRequest) returns (SubmitSearchIndexResponse);
}

// Caller context passed with every capability request for authorization.
message CallerContextMessage {
  string user_id = 1;
  repeated string roles = 2;
  // "User", "System", or "Module"
  string caller_type = 3;
  // The calling module ID (populated when caller_type is "Module").
  string module_id = 4;
}

// --- IAuditLogger ---

message LogAuditRequest {
  CallerContextMessage caller = 1;   // required; attributes the action
  string module_id = 2;              // module where the action occurred
  int32 action = 3;                  // DotNetCloud.Core.Capabilities.AuditAction enum value
  string entity_type = 4;
  string entity_id = 5;              // GUID string
  string description = 6;
}

message LogAuditResponse {
  bool success = 1;
}

// --- IUserDirectory ---

message GetUserRequest {
  CallerContextMessage caller = 1;
  string user_id = 2;
}

message GetUserResponse {
  bool found = 1;
  UserInfo user = 2;
}

message UserInfo {
  string id = 1;
  string display_name = 2;
  string email = 3;
  string avatar_url = 4;
  bool is_active = 5;
}

message SearchUsersRequest {
  CallerContextMessage caller = 1;
  string query = 2;
  int32 max_results = 3;
}

message SearchUsersResponse {
  repeated UserInfo users = 1;
}

// --- ICurrentUserContext ---

message GetCurrentUserRequest {
  CallerContextMessage caller = 1;
}

message GetCurrentUserResponse {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  string locale = 4;
  string timezone = 5;
  repeated string roles = 6;
}

// --- INotificationService ---

message SendNotificationRequest {
  CallerContextMessage caller = 1;
  repeated string recipient_user_ids = 2;
  string title = 3;
  string body = 4;
  string category = 5;
  string link = 6;
}

message SendNotificationResponse {
  bool success = 1;
  int32 delivered_count = 2;
}

// --- IEventBus ---

message PublishEventRequest {
  CallerContextMessage caller = 1;
  string event_type = 2;
  // Event payload serialized as JSON.
  string payload_json = 3;
}

message PublishEventResponse {
  bool success = 1;
}

// --- IModuleSettings ---

message GetSettingRequest {
  CallerContextMessage caller = 1;
  string module_id = 2;
  string key = 3;
}

message GetSettingResponse {
  bool found = 1;
  string value = 2;
}

message SetSettingRequest {
  CallerContextMessage caller = 1;
  string module_id = 2;
  string key = 3;
  string value = 4;
}

message SetSettingResponse {
  bool success = 1;
}

// --- AdminSharedFolder Cleanup ---

message CleanupAdminSharedFolderRequest {
  CallerContextMessage caller = 1;
  string shared_folder_id = 2;
  string display_name = 3;
  repeated MountedEntryMessage mounted_entries = 4;
}

message MountedEntryMessage {
  string relative_path = 1;
  bool is_directory = 2;
}

message CleanupAdminSharedFolderResponse {
  bool success = 1;
  string error_message = 2;
}

// --- IGroupDirectory ---

message GetGroupRequest {
  CallerContextMessage caller = 1;
  string group_id = 2;
}

message GetGroupResponse {
  bool found = 1;
  GroupInfoMessage group = 2;
}

message GroupInfoMessage {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string description = 4;
  bool is_all_users_group = 5;
  int32 member_count = 6;
  string created_at = 7;
}

// --- BroadcastRealtimeEvent ---

message BroadcastRealtimeEventRequest {
  CallerContextMessage caller = 1;
  string group = 2;       // SignalR group name (e.g., "chat-channel-{channelId}")
  string event_name = 3;  // Event name (e.g., "NewMessage", "TypingStarted")
  string payload_json = 4; // Serialized JSON payload
  string target_user_id = 5; // If set, sends only to this user (per-user delivery)
}

message BroadcastRealtimeEventResponse {
  bool success = 1;
}

// --- Search Indexing (real-time bridge) ---

message SubmitSearchIndexRequest {
  // Owning module ID (e.g. "notes", "files").
  string module_id = 1;
  // Entity ID that changed (GUID string).
  string entity_id = 2;
  // DotNetCloud.Core.Events.Search.SearchIndexAction: 0 = Index, 1 = Remove.
  int32 action = 3;
}

message SubmitSearchIndexResponse {
  bool success = 1;
}
