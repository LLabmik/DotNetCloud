syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "DotNetCloud.Core.Grpc.Lifecycle";

package dotnetcloud.lifecycle;

// ModuleLifecycle service: called by the core supervisor to control module processes.
// Each module process hosts this service on its gRPC endpoint.
service ModuleLifecycle {
  // Initializes the module with its configuration and granted capabilities.
  rpc Initialize (InitializeRequest) returns (InitializeResponse);

  // Starts the module after initialization.
  rpc Start (StartRequest) returns (StartResponse);

  // Gracefully stops the module, allowing it to drain active work.
  rpc Stop (StopRequest) returns (StopResponse);

  // Performs a health check on the module.
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);

  // Gets the module's current manifest information.
  rpc GetManifest (GetManifestRequest) returns (GetManifestResponse);

  // Gets the module host's background service run status (admin System page).
  rpc GetBackgroundServices (GetBackgroundServicesRequest) returns (GetBackgroundServicesResponse);

  // Erases every trace of a deleted user from the module's own data store (F12).
  //
  // The core calls this for every installed module when an account is deleted and retries until
  // the module acknowledges or the 72-hour window expires. The call must be idempotent per
  // request_id: a retry after a partial failure may arrive with the same id, and answering
  // "acknowledged" more than once must be harmless. A module that holds no per-user data answers
  // with not_applicable = true rather than failing.
  rpc EraseUserData (EraseUserDataRequest) returns (EraseUserDataResponse);
}

message InitializeRequest {
  // The module ID as registered in the system.
  string module_id = 1;

  // Module-specific configuration as JSON key-value pairs.
  map<string, string> configuration = 2;

  // List of capability names that have been granted to this module.
  repeated string granted_capabilities = 3;

  // The gRPC endpoint of the core server for capability calls.
  string core_endpoint = 4;
}

message InitializeResponse {
  bool success = 1;
  string error_message = 2;
}

message StartRequest {
}

message StartResponse {
  bool success = 1;
  string error_message = 2;
}

message StopRequest {
  // Maximum time in seconds to wait for graceful shutdown.
  int32 timeout_seconds = 1;
}

message StopResponse {
  bool success = 1;
  string error_message = 2;
}

message HealthCheckRequest {
}

message HealthCheckResponse {
  HealthStatus status = 1;
  string description = 2;
  map<string, string> metadata = 3;
}

enum HealthStatus {
  HEALTH_STATUS_UNKNOWN = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

message GetManifestRequest {
}

message GetManifestResponse {
  string module_id = 1;
  string name = 2;
  string version = 3;
  repeated string required_capabilities = 4;
  repeated string published_events = 5;
  repeated string subscribed_events = 6;
}

message GetBackgroundServicesRequest {
}

// Run status of a single background service hosted inside a module process.
message BackgroundServiceInfo {
  string service_name = 1;
  bool is_running = 2;
  google.protobuf.Timestamp current_run_started_at = 3; // optional
  google.protobuf.Timestamp last_run_at = 4;            // optional
  double last_run_duration_ms = 5;
  bool last_run_success = 6;
  string last_run_message = 7;
  int32 total_runs = 8;
  int32 total_failures = 9;
}

message GetBackgroundServicesResponse {
  repeated BackgroundServiceInfo services = 1;
}

message EraseUserDataRequest {
  // Stable id of the erasure request. Repeated calls with the same id must be idempotent.
  string request_id = 1;

  // The user whose data must be removed. Audit entries may keep this pseudonymous id.
  string user_id = 2;

  // Scopes the module held consent for. Advisory: a module erases everything it holds for the
  // user, not only the data covered by these scopes.
  repeated string scopes = 3;
}

message EraseUserDataResponse {
  // True when the module has erased everything it holds for the user.
  bool acknowledged = 1;

  // Rows/objects deleted, per scope (or a single "all" key). For operator visibility only.
  map<string, int32> deleted_counts = 2;

  // Human-readable reason when acknowledged = false.
  string error = 3;

  // True when the module holds no per-user data at all.
  bool not_applicable = 4;
}
