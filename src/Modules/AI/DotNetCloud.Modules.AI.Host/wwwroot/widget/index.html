<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Assistant</title>

    <!--
    The Home-page widget is a separate sandboxed card declared by `ui.widget.path`. Its references are
    relative as well: the core frames it at /apps/dotnetcloud.ai/widget/index.html and strips the
    prefix, so "widget.css" resolves to this process's own static asset.
  -->
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <div class="widget-card">
      <div class="widget-header">
        <span class="widget-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-2c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-.5-4c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" /></svg>
        </span>
        <span class="widget-title">AI Assistant</span>
      </div>

      <div class="widget-body" id="widget-body">
        <p class="widget-stat"><span class="widget-value" id="conversation-count">—</span> conversations</p>
        <p class="widget-meta" id="last-activity">Loading…</p>
      </div>

      <div class="widget-actions">
        <button type="button" class="widget-open" id="open-assistant">Open assistant</button>
      </div>
    </div>

    <script src="../dncModuleBridge.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
