syntax = "proto3";

package dotnetcloud.bookmarks;

option csharp_namespace = "DotNetCloud.Modules.Bookmarks.Host.Protos";

// BookmarksService: gRPC service for the Bookmarks module.
service BookmarksService {
  // Bookmark CRUD
  rpc ListBookmarks (ListBookmarksRequest) returns (ListBookmarksResponse);
  rpc GetBookmark (GetBookmarkRequest) returns (BookmarkResponse);
  rpc CreateBookmark (CreateBookmarkRequest) returns (BookmarkResponse);
  rpc UpdateBookmark (UpdateBookmarkRequest) returns (BookmarkResponse);
  rpc DeleteBookmark (DeleteBookmarkRequest) returns (DeleteBookmarkResponse);
  rpc SearchBookmarks (SearchBookmarksRequest) returns (ListBookmarksResponse);

  // Folder CRUD
  rpc ListFolders (ListBookmarkFoldersRequest) returns (ListBookmarkFoldersResponse);
  rpc GetFolder (GetBookmarkFolderRequest) returns (BookmarkFolderResponse);
  rpc CreateFolder (CreateBookmarkFolderRequest) returns (BookmarkFolderResponse);
  rpc UpdateFolder (UpdateBookmarkFolderRequest) returns (BookmarkFolderResponse);
  rpc DeleteFolder (DeleteBookmarkFolderRequest) returns (DeleteBookmarkFolderResponse);

  // Preview
  rpc FetchPreview (FetchPreviewRequest) returns (PreviewResponse);
  rpc GetPreview (GetPreviewRequest) returns (PreviewResponse);

  // Search index support
  rpc GetSearchableDocuments (GetSearchableDocumentsRequest) returns (stream SearchableDocument);
}

// --- Bookmark Messages ---

message ListBookmarksRequest {
  string user_id = 1;
  string folder_id = 2;
  int32 skip = 3;
  int32 take = 4;
}

message ListBookmarksResponse {
  bool success = 1;
  string error_message = 2;
  repeated BookmarkMessage bookmarks = 3;
}

message GetBookmarkRequest {
  string bookmark_id = 1;
  string user_id = 2;
}

message BookmarkResponse {
  bool success = 1;
  string error_message = 2;
  BookmarkMessage bookmark = 3;
}

message CreateBookmarkRequest {
  string user_id = 1;
  string url = 2;
  string title = 3;
  string description = 4;
  string notes = 5;
  repeated string tags = 6;
  string folder_id = 7;
}

message UpdateBookmarkRequest {
  string bookmark_id = 1;
  string user_id = 2;
  string url = 3;
  string title = 4;
  string description = 5;
  string notes = 6;
  repeated string tags = 7;
  bool update_tags = 8;
  string folder_id = 9;
}

message DeleteBookmarkRequest {
  string bookmark_id = 1;
  string user_id = 2;
}

message DeleteBookmarkResponse {
  bool success = 1;
  string error_message = 2;
}

message SearchBookmarksRequest {
  string user_id = 1;
  string query = 2;
  int32 skip = 3;
  int32 take = 4;
}

message BookmarkMessage {
  string id = 1;
  string owner_id = 2;
  string url = 3;
  string title = 4;
  string description = 5;
  string notes = 6;
  repeated string tags = 7;
  string folder_id = 8;
  string created_at = 9;
  string updated_at = 10;
}

// --- Folder Messages ---

message ListBookmarkFoldersRequest {
  string user_id = 1;
  string parent_id = 2;
}

message ListBookmarkFoldersResponse {
  bool success = 1;
  repeated BookmarkFolderMessage folders = 2;
}

message GetBookmarkFolderRequest {
  string folder_id = 1;
  string user_id = 2;
}

message BookmarkFolderResponse {
  bool success = 1;
  string error_message = 2;
  BookmarkFolderMessage folder = 3;
}

message CreateBookmarkFolderRequest {
  string user_id = 1;
  string name = 2;
  string parent_id = 3;
  string color = 4;
}

message UpdateBookmarkFolderRequest {
  string folder_id = 1;
  string user_id = 2;
  string name = 3;
  string color = 4;
}

message DeleteBookmarkFolderRequest {
  string folder_id = 1;
  string user_id = 2;
}

message DeleteBookmarkFolderResponse {
  bool success = 1;
  string error_message = 2;
}

message BookmarkFolderMessage {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  string parent_id = 4;
  string color = 5;
  int32 sort_order = 6;
  string created_at = 7;
  string updated_at = 8;
}

// --- Preview Messages ---

message FetchPreviewRequest {
  string bookmark_id = 1;
}

message GetPreviewRequest {
  string bookmark_id = 1;
}

message PreviewResponse {
  bool success = 1;
  BookmarkPreviewMessage preview = 2;
}

message BookmarkPreviewMessage {
  string id = 1;
  string bookmark_id = 2;
  string title = 3;
  string description = 4;
  string image_url = 5;
  string favicon_url = 6;
  string site_name = 7;
  string fetched_at = 8;
}

// --- Search Index ---

message GetSearchableDocumentsRequest {
  string user_id = 1;
}

message SearchableDocument {
  string module_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  string title = 4;
  string content = 5;
  string summary = 6;
  string owner_id = 7;
  string created_at = 8;
  string updated_at = 9;
}
