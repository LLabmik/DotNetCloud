syntax = "proto3";

option csharp_namespace = "DotNetCloud.Modules.Chat.Host.Protos";

package dotnetcloud.chat;

// ChatService: gRPC service for the Chat module.
// The core server calls these RPCs to interact with the Chat module.
service ChatService {
  // Creates a new channel.
  rpc CreateChannel (CreateChannelRequest) returns (ChannelResponse);

  // Gets a channel by ID.
  rpc GetChannel (GetChannelRequest) returns (ChannelResponse);

  // Lists channels the user belongs to.
  rpc ListChannels (ListChannelsRequest) returns (ListChannelsResponse);

  // Sends a message to a channel.
  rpc SendMessage (SendMessageRequest) returns (MessageResponse);

  // Gets paginated messages from a channel.
  rpc GetMessages (GetMessagesRequest) returns (GetMessagesResponse);

  // Edits an existing message.
  rpc EditMessage (EditMessageRequest) returns (MessageResponse);

  // Deletes a message (soft-delete).
  rpc DeleteMessage (DeleteMessageRequest) returns (DeleteMessageResponse);

  // Adds a reaction to a message.
  rpc AddReaction (AddReactionRequest) returns (ReactionResponse);

  // Removes a reaction from a message.
  rpc RemoveReaction (RemoveReactionRequest) returns (ReactionResponse);

  // Notifies that a user is typing in a channel.
  rpc NotifyTyping (TypingRequest) returns (TypingResponse);

  // Returns all searchable documents for full reindex (streaming).
  rpc GetSearchableDocuments (GetSearchableDocumentsRequest) returns (stream SearchableDocument);

  // Returns a single searchable document by entity ID.
  rpc GetSearchableDocument (GetSearchableDocumentRequest) returns (SearchableDocumentResponse);

  // Initiates a new video call in a channel.
  rpc InitiateVideoCall (InitiateVideoCallRequest) returns (VideoCallResponse);

  // Joins an active video call.
  rpc JoinVideoCall (JoinVideoCallRequest) returns (VideoCallResponse);

  // Leaves an active video call.
  rpc LeaveVideoCall (LeaveVideoCallRequest) returns (VideoCallOperationResponse);

  // Ends a video call for all participants.
  rpc EndVideoCall (EndVideoCallRequest) returns (VideoCallOperationResponse);

  // Rejects an incoming video call.
  rpc RejectVideoCall (RejectVideoCallRequest) returns (VideoCallOperationResponse);

  // Gets paginated call history for a channel.
  rpc GetCallHistory (GetCallHistoryRequest) returns (GetCallHistoryResponse);

  // Gets the currently active call for a channel.
  rpc GetActiveCall (GetActiveCallRequest) returns (VideoCallResponse);

  // Marks a channel as read up to a specific message for a user.
  rpc MarkAsRead (MarkAsReadRequest) returns (MarkAsReadResponse);

  // Gets unread message counts per channel for a user.
  rpc GetUnreadCounts (GetUnreadCountsRequest) returns (GetUnreadCountsResponse);

  // Lists members of a channel.
  rpc ListChannelMembers (ListChannelMembersRequest) returns (ListChannelMembersResponse);

  // WebRTC signaling: sends an SDP offer to a target participant.
  rpc SendCallOffer (SendCallOfferRequest) returns (CallSignalingResponse);

  // WebRTC signaling: sends an SDP answer to a target participant.
  rpc SendCallAnswer (SendCallAnswerRequest) returns (CallSignalingResponse);

  // WebRTC signaling: sends an ICE candidate to a target participant.
  rpc SendIceCandidate (SendIceCandidateRequest) returns (CallSignalingResponse);

  // WebRTC signaling: sends a media state change notification.
  rpc SendMediaStateChange (SendMediaStateChangeRequest) returns (CallSignalingResponse);

  // Invites a user to join an active call.
  rpc InviteToCall (InviteToCallRequest) returns (VideoCallOperationResponse);

  // Transfers the host role of an active call.
  rpc TransferCallHost (TransferCallHostRequest) returns (VideoCallOperationResponse);

  // Sends a push notification to a user's registered devices (FCM/UnifiedPush).
  rpc SendPushNotification (SendPushNotificationRequest) returns (SendPushNotificationResponse);
}

// --- CreateChannel ---

message CreateChannelRequest {
  string name = 1;
  string description = 2;
  string type = 3;       // Public, Private, DirectMessage, Group
  string topic = 4;
  string user_id = 5;
  repeated string member_ids = 6;
  string organization_id = 7;  // Optional: organization this channel belongs to
}

message ChannelResponse {
  bool success = 1;
  string error_message = 2;
  ChannelMessage channel = 3;
}

// --- GetChannel ---

message GetChannelRequest {
  string channel_id = 1;
  string user_id = 2;
}

// --- ListChannels ---

message ListChannelsRequest {
  string user_id = 1;
}

message ListChannelsResponse {
  repeated ChannelMessage channels = 1;
}

// --- SendMessage ---

message SendMessageRequest {
  string channel_id = 1;
  string user_id = 2;
  string content = 3;
  string reply_to_message_id = 4;  // optional
}

message MessageResponse {
  bool success = 1;
  string error_message = 2;
  ChatMessageMessage message = 3;
}

// --- GetMessages ---

message GetMessagesRequest {
  string channel_id = 1;
  string user_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetMessagesResponse {
  repeated ChatMessageMessage messages = 1;
  int32 total_count = 2;
}

// --- EditMessage ---

message EditMessageRequest {
  string message_id = 1;
  string user_id = 2;
  string new_content = 3;
}

// --- DeleteMessage ---

message DeleteMessageRequest {
  string message_id = 1;
  string user_id = 2;
}

message DeleteMessageResponse {
  bool success = 1;
  string error_message = 2;
}

// --- Reactions ---

message AddReactionRequest {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}

message RemoveReactionRequest {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}

message ReactionResponse {
  bool success = 1;
  string error_message = 2;
}

// --- Typing ---

message TypingRequest {
  string channel_id = 1;
  string user_id = 2;
}

message TypingResponse {
  bool success = 1;
}

// --- Shared Messages ---

message ChannelMessage {
  string id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string topic = 5;
  string avatar_url = 6;
  bool is_archived = 7;
  int32 member_count = 8;
  string created_at = 9;
  string last_activity_at = 10;
  string created_by_user_id = 11;
}

message ChatMessageMessage {
  string id = 1;
  string channel_id = 2;
  string sender_user_id = 3;
  string content = 4;
  string type = 5;
  string sent_at = 6;
  string edited_at = 7;
  bool is_edited = 8;
  string reply_to_message_id = 9;
  repeated AttachmentMessage attachments = 10;
  string sender_name = 11;
}

message AttachmentMessage {
  string id = 1;
  string file_name = 2;
  string mime_type = 3;
  int64 file_size = 4;
  string thumbnail_url = 5;
  string file_node_id = 6;
}

// --- Search Integration ---

message GetSearchableDocumentsRequest {
  string user_id = 1;
}

message GetSearchableDocumentRequest {
  string entity_id = 1;
}

message SearchableDocumentResponse {
  bool found = 1;
  SearchableDocument document = 2;
}

message SearchableDocument {
  string module_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  string title = 4;
  string content = 5;
  string summary = 6;
  string owner_id = 7;
  string organization_id = 8;
  string created_at = 9;
  string updated_at = 10;
  map<string, string> metadata = 11;
}

// --- Video Call Messages ---

message InitiateVideoCallRequest {
  string channel_id = 1;
  string user_id = 2;
  string media_type = 3;  // Audio or Video
}

message JoinVideoCallRequest {
  string call_id = 1;
  string user_id = 2;
  bool with_audio = 3;
  bool with_video = 4;
}

message LeaveVideoCallRequest {
  string call_id = 1;
  string user_id = 2;
}

message EndVideoCallRequest {
  string call_id = 1;
  string user_id = 2;
}

message RejectVideoCallRequest {
  string call_id = 1;
  string user_id = 2;
}

message GetCallHistoryRequest {
  string channel_id = 1;
  string user_id = 2;
  int32 skip = 3;
  int32 take = 4;
}

message GetActiveCallRequest {
  string channel_id = 1;
  string user_id = 2;
}

message VideoCallResponse {
  bool success = 1;
  string error_message = 2;
  VideoCallMessage call = 3;
}

message VideoCallOperationResponse {
  bool success = 1;
  string error_message = 2;
}

message GetCallHistoryResponse {
  repeated CallHistoryMessage calls = 1;
}

message VideoCallMessage {
  string id = 1;
  string channel_id = 2;
  string initiator_user_id = 3;
  string state = 4;
  string media_type = 5;
  bool is_group_call = 6;
  string started_at_utc = 7;
  string ended_at_utc = 8;
  string end_reason = 9;
  int32 max_participants = 10;
  string created_at_utc = 11;
  repeated CallParticipantMessage participants = 12;
}

message CallParticipantMessage {
  string id = 1;
  string user_id = 2;
  string role = 3;
  string joined_at_utc = 4;
  string left_at_utc = 5;
  bool has_audio = 6;
  bool has_video = 7;
  bool has_screen_share = 8;
}

message CallHistoryMessage {
  string id = 1;
  string channel_id = 2;
  string initiator_user_id = 3;
  string state = 4;
  string media_type = 5;
  string end_reason = 6;
  int32 duration_seconds = 7;
  int32 participant_count = 8;
  string created_at_utc = 9;
}

// --- MarkAsRead ---

message MarkAsReadRequest {
  string channel_id = 1;
  string user_id = 2;
  string message_id = 3;
}

message MarkAsReadResponse {
  bool success = 1;
  string error_message = 2;
}

// --- GetUnreadCounts ---

message GetUnreadCountsRequest {
  string user_id = 1;
}

message GetUnreadCountsResponse {
  repeated UnreadCountEntry counts = 1;
}

message UnreadCountEntry {
  string channel_id = 1;
  int32 unread_count = 2;
  int32 mention_count = 3;
  bool is_muted = 4;
  bool is_pinned = 5;
}

// --- ListChannelMembers ---

message ListChannelMembersRequest {
  string channel_id = 1;
  string user_id = 2;
}

message ListChannelMembersResponse {
  repeated ChannelMemberMessage members = 1;
}

message ChannelMemberMessage {
  string user_id = 1;
  string display_name = 2;
  string username = 3;
  string role = 4;
  string joined_at = 5;
  bool is_muted = 6;
  string notification_pref = 7;
}

// --- WebRTC Signaling ---

message SendCallOfferRequest {
  string call_id = 1;
  string user_id = 2;
  string target_user_id = 3;
  string sdp_offer = 4;
}

message SendCallAnswerRequest {
  string call_id = 1;
  string user_id = 2;
  string target_user_id = 3;
  string sdp_answer = 4;
}

message SendIceCandidateRequest {
  string call_id = 1;
  string user_id = 2;
  string target_user_id = 3;
  string ice_candidate = 4;
}

message SendMediaStateChangeRequest {
  string call_id = 1;
  string user_id = 2;
  string media_type = 3;   // "Audio", "Video", or "ScreenShare"
  bool enabled = 4;
}

message CallSignalingResponse {
  bool success = 1;
  string error_message = 2;
}

// --- InviteToCall ---

message InviteToCallRequest {
  string call_id = 1;
  string user_id = 2;
  string target_user_id = 3;
}

// --- TransferCallHost ---

message TransferCallHostRequest {
  string call_id = 1;
  string user_id = 2;
  string new_host_user_id = 3;
}

// --- SendPushNotification ---

message SendPushNotificationRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  string category = 4;  // one of NotificationCategory enum names (e.g. "FileShared")
  map<string, string> data = 5;
}

message SendPushNotificationResponse {
  bool success = 1;
  string error_message = 2;
}
