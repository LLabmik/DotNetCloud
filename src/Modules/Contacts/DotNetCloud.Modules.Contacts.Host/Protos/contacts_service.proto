syntax = "proto3";

option csharp_namespace = "DotNetCloud.Modules.Contacts.Host.Protos";

package dotnetcloud.contacts;

// ContactsService: gRPC service for the Contacts module.
// The core server calls these RPCs to interact with the Contacts module.
service ContactsService {
  // Creates a new contact.
  rpc CreateContact (CreateContactRequest) returns (ContactResponse);

  // Gets a contact by ID.
  rpc GetContact (GetContactRequest) returns (ContactResponse);

  // Lists contacts for a user.
  rpc ListContacts (ListContactsRequest) returns (ListContactsResponse);

  // Updates a contact.
  rpc UpdateContact (UpdateContactRequest) returns (ContactResponse);

  // Deletes a contact (soft-delete).
  rpc DeleteContact (DeleteContactRequest) returns (DeleteContactResponse);

  // Exports a contact as vCard text.
  rpc ExportVCard (ExportVCardRequest) returns (ExportVCardResponse);

  // Imports contacts from vCard text.
  rpc ImportVCards (ImportVCardsRequest) returns (ImportVCardsResponse);

  // Returns all searchable documents for full reindex (streaming).
  rpc GetSearchableDocuments (GetSearchableDocumentsRequest) returns (stream SearchableDocument);

  // Returns a single searchable document by entity ID.
  rpc GetSearchableDocument (GetSearchableDocumentRequest) returns (SearchableDocumentResponse);

  // Searches contacts by display name or email for autocomplete/lookup UIs.
  rpc SearchContacts (SearchContactsRequest) returns (SearchContactsResponse);

  // ─── Groups ───────────────────────────────────────────────────────────
  // Lists contact groups for a user.
  rpc ListGroups (ListGroupsRequest) returns (ListGroupsResponse);
  // Gets a single group by ID.
  rpc GetGroup (GetGroupRequest) returns (GroupResponse);
  // Creates a new contact group.
  rpc CreateGroup (CreateGroupRequest) returns (GroupResponse);
  // Renames a contact group.
  rpc RenameGroup (RenameGroupRequest) returns (GroupResponse);
  // Deletes a contact group.
  rpc DeleteGroup (DeleteGroupRequest) returns (DeleteGroupResponse);
  // Adds a contact to a group.
  rpc AddContactToGroup (AddContactToGroupRequest) returns (AddContactToGroupResponse);
  // Removes a contact from a group.
  rpc RemoveContactFromGroup (RemoveContactFromGroupRequest) returns (RemoveContactFromGroupResponse);
  // Lists contacts that are members of a group.
  rpc ListGroupMembers (ListGroupMembersRequest) returns (ListGroupMembersResponse);

  // ─── Related Entities ──────────────────────────────────────────────────
  // Gets related events and notes for a contact.
  rpc GetContactRelated (GetContactRelatedRequest) returns (ContactRelatedResponse);

  // ─── Sharing ──────────────────────────────────────────────────────────
  // Lists shares for a contact.
  rpc ListContactShares (ListContactSharesRequest) returns (ListContactSharesResponse);
  // Shares a contact with a user or team.
  rpc ShareContact (ShareContactRequest) returns (ShareContactResponse);
  // Revokes a contact share.
  rpc RevokeContactShare (RevokeContactShareRequest) returns (RevokeContactShareResponse);
}

// --- CreateContact ---

message CreateContactRequest {
  string user_id = 1;
  string contact_type = 2;    // Person, Organization, Group
  string display_name = 3;
  string first_name = 4;
  string last_name = 5;
  string middle_name = 6;
  string prefix = 7;
  string suffix = 8;
  string organization = 9;
  string department = 10;
  string job_title = 11;
  string notes = 12;
  string birthday = 13;       // ISO 8601 date (yyyy-MM-dd)
  string website_url = 14;
  repeated ContactEmailMessage emails = 15;
  repeated ContactPhoneMessage phones = 16;
  repeated ContactAddressMessage addresses = 17;
  map<string, string> custom_fields = 18;
}

message ContactResponse {
  bool success = 1;
  string error_message = 2;
  ContactMessage contact = 3;
}

// --- GetContact ---

message GetContactRequest {
  string contact_id = 1;
  string user_id = 2;
}

// --- ListContacts ---

message ListContactsRequest {
  string user_id = 1;
  string search = 2;
  int32 skip = 3;
  int32 take = 4;
}

message ListContactsResponse {
  bool success = 1;
  string error_message = 2;
  repeated ContactMessage contacts = 3;
}

// --- UpdateContact ---

message UpdateContactRequest {
  string contact_id = 1;
  string user_id = 2;
  string display_name = 3;
  string first_name = 4;
  string last_name = 5;
  string middle_name = 6;
  string prefix = 7;
  string suffix = 8;
  string organization = 9;
  string department = 10;
  string job_title = 11;
  string notes = 12;
  string birthday = 13;
  string website_url = 14;
  repeated ContactEmailMessage emails = 15;
  repeated ContactPhoneMessage phones = 16;
  repeated ContactAddressMessage addresses = 17;
  map<string, string> custom_fields = 18;
}

// --- DeleteContact ---

message DeleteContactRequest {
  string contact_id = 1;
  string user_id = 2;
}

message DeleteContactResponse {
  bool success = 1;
  string error_message = 2;
}

// --- ExportVCard ---

message ExportVCardRequest {
  string contact_id = 1;
  string user_id = 2;
}

message ExportVCardResponse {
  bool success = 1;
  string error_message = 2;
  string vcard_text = 3;
}

// --- ImportVCards ---

message ImportVCardsRequest {
  string user_id = 1;
  string vcard_text = 2;
}

message ImportVCardsResponse {
  bool success = 1;
  string error_message = 2;
  repeated string created_contact_ids = 3;
}

// --- Shared Messages ---

message ContactMessage {
  string id = 1;
  string owner_id = 2;
  string contact_type = 3;
  string display_name = 4;
  string first_name = 5;
  string last_name = 6;
  string middle_name = 7;
  string prefix = 8;
  string suffix = 9;
  string organization = 10;
  string department = 11;
  string job_title = 12;
  string notes = 13;
  string birthday = 14;
  string website_url = 15;
  string avatar_url = 16;
  string etag = 17;
  string created_at = 18;     // ISO 8601 timestamp
  string updated_at = 19;
  repeated ContactEmailMessage emails = 20;
  repeated ContactPhoneMessage phones = 21;
  repeated ContactAddressMessage addresses = 22;
  map<string, string> custom_fields = 23;
}

message ContactEmailMessage {
  string address = 1;
  string label = 2;
  bool is_primary = 3;
}

message ContactPhoneMessage {
  string number = 1;
  string label = 2;
  bool is_primary = 3;
}

message ContactAddressMessage {
  string label = 1;
  string street = 2;
  string city = 3;
  string region = 4;
  string postal_code = 5;
  string country = 6;
  bool is_primary = 7;
}

// --- Search Integration ---

message GetSearchableDocumentsRequest {
  string user_id = 1;
}

message GetSearchableDocumentRequest {
  string entity_id = 1;
}

message SearchableDocumentResponse {
  bool found = 1;
  SearchableDocument document = 2;
}

message SearchableDocument {
  string module_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  string title = 4;
  string content = 5;
  string summary = 6;
  string owner_id = 7;
  string organization_id = 8;
  string created_at = 9;
  string updated_at = 10;
  map<string, string> metadata = 11;
}

// --- SearchContacts ---

message SearchContactsRequest {
  string user_id = 1;       // GUID of the user whose contacts to search
  string query = 2;         // Search text (matched against display name and emails)
  int32 max_results = 3;    // Max results to return (default 10)
}

message SearchContactsResponse {
  bool success = 1;
  string error_message = 2;
  repeated ContactSearchResultMessage results = 3;
}

message ContactSearchResultMessage {
  string contact_id = 1;                     // GUID of the contact
  string display_name = 2;                   // Contact display name
  repeated ContactEmailMessage emails = 3;    // Reuses existing ContactEmailMessage (address, label, is_primary)
}

// ─── Groups ───────────────────────────────────────────────────────────────

message ListGroupsRequest {
  string user_id = 1;
}

message ListGroupsResponse {
  bool success = 1;
  string error_message = 2;
  repeated GroupMessage groups = 3;
}

message GetGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message GroupResponse {
  bool success = 1;
  string error_message = 2;
  GroupMessage group = 3;
}

message CreateGroupRequest {
  string user_id = 1;
  string name = 2;
}

message RenameGroupRequest {
  string group_id = 1;
  string user_id = 2;
  string new_name = 3;
}

message DeleteGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message DeleteGroupResponse {
  bool success = 1;
  string error_message = 2;
}

message GroupMessage {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  int32 member_count = 4;
  string created_at = 5;
}

// ─── Group Members ─────────────────────────────────────────────────────────

message AddContactToGroupRequest {
  string group_id = 1;
  string contact_id = 2;
  string user_id = 3;
}

message AddContactToGroupResponse {
  bool success = 1;
  string error_message = 2;
}

message RemoveContactFromGroupRequest {
  string group_id = 1;
  string contact_id = 2;
  string user_id = 3;
}

message RemoveContactFromGroupResponse {
  bool success = 1;
  string error_message = 2;
}

message ListGroupMembersRequest {
  string group_id = 1;
  string user_id = 2;
}

message ListGroupMembersResponse {
  bool success = 1;
  string error_message = 2;
  repeated ContactMessage members = 3;
}

// ─── Related Entities ──────────────────────────────────────────────────────

message GetContactRelatedRequest {
  string contact_id = 1;
  string user_id = 2;
}

message ContactRelatedResponse {
  bool success = 1;
  string error_message = 2;
  repeated ContactRelatedItem related_items = 3;
}

message ContactRelatedItem {
  string id = 1;
  string entity_type = 2;     // "CalendarEvent", "Note", "File", etc.
  string title = 3;
  string description = 4;
  string url = 5;
  string created_at = 6;
}

// ─── Sharing ───────────────────────────────────────────────────────────────

message ListContactSharesRequest {
  string contact_id = 1;
  string user_id = 2;
}

message ListContactSharesResponse {
  bool success = 1;
  string error_message = 2;
  repeated ContactShareMessage shares = 3;
}

message ShareContactRequest {
  string contact_id = 1;
  string user_id = 2;          // caller
  string target_user_id = 3;   // optional GUID
  string team_id = 4;          // optional GUID
  string permission = 5;       // "ReadOnly", "ReadWrite", "Admin"
}

message ShareContactResponse {
  bool success = 1;
  string error_message = 2;
  ContactShareMessage share = 3;
}

message RevokeContactShareRequest {
  string share_id = 1;
  string user_id = 2;
}

message RevokeContactShareResponse {
  bool success = 1;
  string error_message = 2;
}

message ContactShareMessage {
  string id = 1;
  string contact_id = 2;
  string shared_by_user_id = 3;
  string shared_with_user_id = 4;
  string shared_with_team_id = 5;
  string permission = 6;
  string created_at = 7;
}
