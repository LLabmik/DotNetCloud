syntax = "proto3";

option csharp_namespace = "DotNetCloud.Modules.Tracks.Host.Protos";

package dotnetcloud.tracks;

// TracksGrpcService: gRPC service for the Tracks module.
// The core server calls these RPCs to interact with the Tracks module.
service TracksGrpcService {
  // ─── Products ───
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc GetProduct (GetProductRequest) returns (ProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductResponse);
  rpc DeleteProduct (DeleteProductRequest) returns (GenericResponse);
  rpc ListDeletedProducts (ListDeletedProductsRequest) returns (ListProductsResponse);
  rpc RestoreProduct (RestoreProductRequest) returns (ProductResponse);
  rpc PermanentDeleteProduct (PermanentDeleteProductRequest) returns (GenericResponse);

  // ─── Product Members ───
  rpc ListProductMembers (ListProductMembersRequest) returns (ListProductMembersResponse);
  rpc AddProductMember (AddProductMemberRequest) returns (ProductMemberResponse);
  rpc RemoveProductMember (RemoveProductMemberRequest) returns (GenericResponse);
  rpc UpdateProductMemberRole (UpdateProductMemberRoleRequest) returns (ProductMemberResponse);

  // ─── Labels ───
  rpc ListLabels (ListLabelsRequest) returns (ListLabelsResponse);
  rpc CreateLabel (CreateLabelRequest) returns (LabelResponse);
  rpc UpdateLabel (UpdateLabelRequest) returns (LabelResponse);
  rpc DeleteLabel (DeleteLabelRequest) returns (GenericResponse);

  // ─── Swimlanes ───
  rpc CreateSwimlane (CreateSwimlaneRequest) returns (SwimlaneResponse);
  rpc ListProductSwimlanes (ListProductSwimlanesRequest) returns (ListSwimlanesResponse);
  rpc ListWorkItemSwimlanes (ListWorkItemSwimlanesRequest) returns (ListSwimlanesResponse);
  rpc CreateWorkItemSwimlane (CreateWorkItemSwimlaneRequest) returns (SwimlaneResponse);
  rpc UpdateSwimlane (UpdateSwimlaneRequest) returns (SwimlaneResponse);
  rpc DeleteSwimlane (DeleteSwimlaneRequest) returns (GenericResponse);
  rpc ReorderSwimlanes (ReorderSwimlanesRequest) returns (GenericResponse);

  // ─── Swimlane Transition Rules ───
  rpc GetSwimlaneTransitionMatrix (GetSwimlaneTransitionMatrixRequest) returns (GetSwimlaneTransitionMatrixResponse);
  rpc SetSwimlaneTransitionMatrix (SetSwimlaneTransitionMatrixRequest) returns (SetSwimlaneTransitionMatrixResponse);

  // ─── Work Items ───
  rpc CreateWorkItem (CreateWorkItemRequest) returns (WorkItemResponse);
  rpc GetWorkItem (GetWorkItemRequest) returns (WorkItemResponse);
  rpc ListWorkItems (ListWorkItemsRequest) returns (ListWorkItemsResponse);
  rpc GetWorkItemByNumber (GetWorkItemByNumberRequest) returns (WorkItemResponse);
  rpc CreateEpic (CreateEpicRequest) returns (WorkItemResponse);
  rpc CreateFeature (CreateFeatureRequest) returns (WorkItemResponse);
  rpc CreateItem (CreateItemRequest) returns (WorkItemResponse);
  rpc CreateSubItem (CreateSubItemRequest) returns (WorkItemResponse);
  rpc UpdateWorkItem (UpdateWorkItemRequest) returns (WorkItemResponse);
  rpc DeleteWorkItem (DeleteWorkItemRequest) returns (GenericResponse);
  rpc MoveWorkItem (MoveWorkItemRequest) returns (WorkItemResponse);
  rpc GetChildWorkItems (GetChildWorkItemsRequest) returns (ListWorkItemsResponse);
  rpc ListDeletedWorkItems (ListDeletedWorkItemsRequest) returns (ListWorkItemsResponse);
  rpc RestoreWorkItem (RestoreWorkItemRequest) returns (WorkItemResponse);
  rpc PermanentDeleteWorkItem (PermanentDeleteWorkItemRequest) returns (GenericResponse);
  rpc EmptyWorkItemTrash (EmptyWorkItemTrashRequest) returns (EmptyWorkItemTrashResponse);

  // ─── Export ───
  rpc ExportWorkItemsCsv (ExportWorkItemsCsvRequest) returns (ExportWorkItemsCsvResponse);

  // ─── Watchers ───
  rpc GetWatchers (GetWatchersRequest) returns (GetWatchersResponse);
  rpc WatchWorkItem (WatchWorkItemRequest) returns (WatchCountResponse);
  rpc UnwatchWorkItem (UnwatchWorkItemRequest) returns (WatchCountResponse);

  // ─── Assignments ───
  rpc AssignUser (AssignUserRequest) returns (GenericResponse);
  rpc UnassignUser (UnassignUserRequest) returns (GenericResponse);

  // ─── Work Item Labels ───
  rpc AddLabelToWorkItem (AddLabelToWorkItemRequest) returns (GenericResponse);
  rpc RemoveLabelFromWorkItem (RemoveLabelFromWorkItemRequest) returns (GenericResponse);

  // ─── Comments ───
  rpc ListComments (ListCommentsRequest) returns (ListCommentsResponse);
  rpc CreateComment (CreateCommentRequest) returns (CommentResponse);
  rpc UpdateComment (UpdateCommentRequest) returns (CommentResponse);
  rpc DeleteComment (DeleteCommentRequest) returns (GenericResponse);
  rpc ListDeletedComments (ListDeletedCommentsRequest) returns (ListCommentsResponse);
  rpc RestoreComment (RestoreCommentRequest) returns (GenericResponse);
  rpc PermanentDeleteComment (PermanentDeleteCommentRequest) returns (GenericResponse);

  // ─── Checklists ───
  rpc ListChecklists (ListChecklistsRequest) returns (ListChecklistsResponse);
  rpc CreateChecklist (CreateChecklistRequest) returns (ChecklistResponse);
  rpc DeleteChecklist (DeleteChecklistRequest) returns (GenericResponse);
  rpc AddChecklistItem (AddChecklistItemRequest) returns (ChecklistItemResponse);
  rpc ToggleChecklistItem (ToggleChecklistItemRequest) returns (ChecklistItemResponse);
  rpc DeleteChecklistItem (DeleteChecklistItemRequest) returns (GenericResponse);

  // ─── Attachments ───
  rpc ListAttachments (ListAttachmentsRequest) returns (ListAttachmentsResponse);
  rpc AddAttachment (AddAttachmentRequest) returns (AttachmentResponse);
  rpc RemoveAttachment (RemoveAttachmentRequest) returns (GenericResponse);

  // ─── Dependencies ───
  rpc ListDependencies (ListDependenciesRequest) returns (ListDependenciesResponse);
  rpc AddDependency (AddDependencyRequest) returns (DependencyResponse);
  rpc RemoveDependency (RemoveDependencyRequest) returns (GenericResponse);

  // ─── Sprints ───
  rpc ListSprints (ListSprintsRequest) returns (ListSprintsResponse);
  rpc GetSprint (GetSprintRequest) returns (SprintResponse);
  rpc CreateSprint (CreateSprintRequest) returns (SprintResponse);
  rpc UpdateSprint (UpdateSprintRequest) returns (SprintResponse);
  rpc DeleteSprint (DeleteSprintRequest) returns (GenericResponse);
  rpc StartSprint (StartSprintRequest) returns (SprintResponse);
  rpc CompleteSprint (CompleteSprintRequest) returns (SprintResponse);
  rpc AddItemToSprint (AddItemToSprintRequest) returns (GenericResponse);
  rpc RemoveItemFromSprint (RemoveItemFromSprintRequest) returns (GenericResponse);
  rpc GetBacklogItems (GetBacklogItemsRequest) returns (ListWorkItemsResponse);

  // ─── Sprint Planning ───
  rpc CreateSprintPlan (CreateSprintPlanRequest) returns (SprintPlanResponse);
  rpc GetSprintPlan (GetSprintPlanRequest) returns (SprintPlanResponse);
  rpc AdjustSprint (AdjustSprintRequest) returns (SprintPlanResponse);

  // ─── Time Entries ───
  rpc ListTimeEntries (ListTimeEntriesRequest) returns (ListTimeEntriesResponse);
  rpc CreateTimeEntry (CreateTimeEntryRequest) returns (TimeEntryResponse);
  rpc DeleteTimeEntry (DeleteTimeEntryRequest) returns (GenericResponse);
  rpc StartTimer (StartTimerRequest) returns (TimeEntryResponse);
  rpc StopTimer (StopTimerRequest) returns (TimeEntryResponse);

  // ─── Activity ───
  rpc GetProductActivity (GetProductActivityRequest) returns (ListActivityResponse);
  rpc GetWorkItemActivity (GetWorkItemActivityRequest) returns (ListActivityResponse);

  // ─── Analytics ───
  rpc GetProductAnalytics (GetProductAnalyticsRequest) returns (ProductAnalyticsResponse);
  rpc GetVelocityData (GetVelocityDataRequest) returns (GetVelocityDataResponse);
  rpc GetSprintReport (GetSprintReportRequest) returns (SprintReportResponse);
  rpc GetBurndownData (GetBurndownDataRequest) returns (BurndownDataResponse);
  rpc GetProductDashboard (GetProductDashboardRequest) returns (ProductDashboardResponse);

  // ─── Bulk Actions ───
  rpc BulkWorkItemAction (BulkWorkItemActionRequest) returns (BulkWorkItemActionResponse);
  rpc ListProductWorkItems (ListProductWorkItemsRequest) returns (ListWorkItemsResponse);

  // ─── Teams ───
  rpc ListTeams (ListTeamsRequest) returns (ListTeamsResponse);
  rpc GetTeam (GetTeamRequest) returns (TeamResponse);
  rpc CreateTeam (CreateTeamRequest) returns (TeamResponse);
  rpc UpdateTeam (UpdateTeamRequest) returns (TeamResponse);
  rpc DeleteTeam (DeleteTeamRequest) returns (GenericResponse);
  rpc ListTeamMembers (ListTeamMembersRequest) returns (ListTeamMembersResponse);
  rpc AddTeamMember (AddTeamMemberRequest) returns (TeamMemberResponse);
  rpc RemoveTeamMember (RemoveTeamMemberRequest) returns (GenericResponse);
  rpc UpdateTeamMemberRole (UpdateTeamMemberRoleRequest) returns (TeamMemberResponse);

  // ─── Review Sessions ───
  rpc StartReviewSession (StartReviewSessionRequest) returns (ReviewSessionResponse);
  rpc GetReviewSession (GetReviewSessionRequest) returns (ReviewSessionResponse);
  rpc JoinReviewSession (JoinReviewSessionRequest) returns (ReviewSessionResponse);
  rpc LeaveReviewSession (LeaveReviewSessionRequest) returns (GenericResponse);
  rpc SetReviewCurrentItem (SetReviewCurrentItemRequest) returns (ReviewSessionResponse);
  rpc EndReviewSession (EndReviewSessionRequest) returns (ReviewSessionResponse);

  // ─── Planning Poker ───
  rpc StartPokerSession (StartPokerSessionRequest) returns (PokerSessionResponse);
  rpc GetPokerSession (GetPokerSessionRequest) returns (PokerSessionResponse);
  rpc GetActivePokerSessionByReviewSession (GetActivePokerSessionByReviewSessionRequest) returns (PokerSessionResponse);
  rpc SubmitPokerVote (SubmitPokerVoteRequest) returns (PokerSessionResponse);
  rpc RevealPokerSession (RevealPokerSessionRequest) returns (PokerSessionResponse);
  rpc AcceptPokerEstimate (AcceptPokerEstimateRequest) returns (PokerSessionResponse);
  rpc GetPokerVoteStatus (GetPokerVoteStatusRequest) returns (PokerVoteStatusResponse);

  // ─── User Search ───
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse);

  // ─── Custom Views ───
  rpc ListCustomViews (ListCustomViewsRequest) returns (ListCustomViewsResponse);
  rpc CreateCustomView (CreateCustomViewRequest) returns (CustomViewResponse);
  rpc UpdateCustomView (UpdateCustomViewRequest) returns (CustomViewResponse);
  rpc DeleteCustomView (DeleteCustomViewRequest) returns (GenericResponse);

  // ─── Webhooks ───
  rpc ListProductWebhooks (ListProductWebhooksRequest) returns (ListProductWebhooksResponse);
  rpc CreateProductWebhook (CreateProductWebhookRequest) returns (WebhookSubscriptionResponse);
  rpc UpdateProductWebhook (UpdateProductWebhookRequest) returns (WebhookSubscriptionResponse);
  rpc DeleteProductWebhook (DeleteProductWebhookRequest) returns (GenericResponse);
  rpc TestProductWebhook (TestProductWebhookRequest) returns (TestProductWebhookResponse);

  // ─── Roadmap ───
  rpc GetRoadmapData (GetRoadmapDataRequest) returns (RoadmapDataResponse);

  // ─── Automation Rules ───
  rpc ListAutomationRules (ListAutomationRulesRequest) returns (ListAutomationRulesResponse);
  rpc CreateAutomationRule (CreateAutomationRuleRequest) returns (AutomationRuleResponse);
  rpc UpdateAutomationRule (UpdateAutomationRuleRequest) returns (AutomationRuleResponse);
  rpc DeleteAutomationRule (DeleteAutomationRuleRequest) returns (GenericResponse);

  // ─── Goals / OKRs ───
  rpc ListGoals (ListGoalsRequest) returns (ListGoalsResponse);
  rpc GetGoal (GetGoalRequest) returns (GoalResponse);
  rpc CreateGoal (CreateGoalRequest) returns (GoalResponse);
  rpc UpdateGoal (UpdateGoalRequest) returns (GoalResponse);
  rpc DeleteGoal (DeleteGoalRequest) returns (GenericResponse);
  rpc LinkGoalWorkItem (LinkGoalWorkItemRequest) returns (GenericResponse);
  rpc UnlinkGoalWorkItem (UnlinkGoalWorkItemRequest) returns (GenericResponse);

  // ─── Capacity ───
  rpc GetProductCapacity (GetProductCapacityRequest) returns (ProductCapacityResponse);
  rpc GetSprintCapacity (GetSprintCapacityRequest) returns (SprintCapacityResponse);

  // ─── Search Integration ───
  rpc GetSearchableDocuments (GetSearchableDocumentsRequest) returns (stream SearchableDocument);
  rpc GetSearchableDocument (GetSearchableDocumentRequest) returns (SearchableDocumentResponse);
}

// ═══════════════════════════════════════════════════════════════════════════════
// GENERIC / SHARED MESSAGES
// ═══════════════════════════════════════════════════════════════════════════════

message GenericResponse {
  bool success = 1;
  string error_message = 2;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PRODUCTS
// ═══════════════════════════════════════════════════════════════════════════════

message CreateProductRequest {
  string user_id = 1;
  string organization_id = 2;
  string name = 3;
  string description = 4;
  string color = 5;
  bool sub_items_enabled = 6;
}

message ProductResponse {
  bool success = 1;
  string error_message = 2;
  ProductMessage product = 3;
}

message GetProductRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListProductsRequest {
  string organization_id = 1;
  string user_id = 2;
  int32 skip = 3;
  int32 take = 4;
  bool include_archived = 5;
}

message ListProductsResponse {
  bool success = 1;
  string error_message = 2;
  repeated ProductMessage products = 3;
}

message UpdateProductRequest {
  string product_id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
  string color = 5;
  bool sub_items_enabled = 6;
  string etag = 7;
}

message DeleteProductRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListDeletedProductsRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RestoreProductRequest {
  string product_id = 1;
  string user_id = 2;
}

message PermanentDeleteProductRequest {
  string product_id = 1;
  string user_id = 2;
}

message ProductMessage {
  string id = 1;
  string organization_id = 2;
  string owner_id = 3;
  string name = 4;
  string description = 5;
  string color = 6;
  bool sub_items_enabled = 7;
  bool is_archived = 8;
  int32 swimlane_count = 9;
  int32 epic_count = 10;
  int32 member_count = 11;
  int32 label_count = 12;
  string etag = 13;
  string created_at = 14;
  string updated_at = 15;
  string deleted_at = 16;
  string deleted_by_user_id = 17;
  string deleted_by_display_name = 18;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PRODUCT MEMBERS
// ═══════════════════════════════════════════════════════════════════════════════

message ListProductMembersRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListProductMembersResponse {
  bool success = 1;
  string error_message = 2;
  repeated ProductMemberMessage members = 3;
}

message AddProductMemberRequest {
  string product_id = 1;
  string user_id = 2;
  string member_user_id = 3;
  string role = 4; // Viewer, Member, Admin, Owner
}

message ProductMemberResponse {
  bool success = 1;
  string error_message = 2;
  ProductMemberMessage member = 3;
}

message RemoveProductMemberRequest {
  string product_id = 1;
  string user_id = 2;
  string member_user_id = 3;
}

message UpdateProductMemberRoleRequest {
  string product_id = 1;
  string user_id = 2;
  string member_user_id = 3;
  string role = 4; // Viewer, Member, Admin, Owner
}

message ProductMemberMessage {
  string user_id = 1;
  string display_name = 2;
  string role = 3;
  string joined_at = 4;
}

// ═══════════════════════════════════════════════════════════════════════════════
// LABELS
// ═══════════════════════════════════════════════════════════════════════════════

message ListLabelsRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListLabelsResponse {
  bool success = 1;
  string error_message = 2;
  repeated LabelMessage labels = 3;
}

message CreateLabelRequest {
  string product_id = 1;
  string user_id = 2;
  string title = 3;
  string color = 4;
}

message LabelResponse {
  bool success = 1;
  string error_message = 2;
  LabelMessage label = 3;
}

message UpdateLabelRequest {
  string product_id = 1;
  string label_id = 2;
  string user_id = 3;
  string title = 4;
  string color = 5;
}

message DeleteLabelRequest {
  string product_id = 1;
  string label_id = 2;
  string user_id = 3;
}

message LabelMessage {
  string id = 1;
  string product_id = 2;
  string title = 3;
  string color = 4;
  string created_at = 5;
}

// ═══════════════════════════════════════════════════════════════════════════════
// SWIMLANES
// ═══════════════════════════════════════════════════════════════════════════════

message CreateSwimlaneRequest {
  string product_id = 1;
  string user_id = 2;
  string title = 3;
  string color = 4;
  bool is_done = 5;
  int32 card_limit = 6;
}

message SwimlaneResponse {
  bool success = 1;
  string error_message = 2;
  SwimlaneMessage swimlane = 3;
}

message ListProductSwimlanesRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListWorkItemSwimlanesRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message ListSwimlanesResponse {
  bool success = 1;
  string error_message = 2;
  repeated SwimlaneMessage swimlanes = 3;
}

message CreateWorkItemSwimlaneRequest {
  string work_item_id = 1;
  string user_id = 2;
  string title = 3;
  string color = 4;
  bool is_done = 5;
  int32 card_limit = 6;
}

message UpdateSwimlaneRequest {
  string swimlane_id = 1;
  string user_id = 2;
  string title = 3;
  string color = 4;
  bool is_done = 5;
  int32 card_limit = 6;
}

message DeleteSwimlaneRequest {
  string swimlane_id = 1;
  string user_id = 2;
}

message ReorderSwimlanesRequest {
  string user_id = 1;
  repeated string ordered_ids = 2;
}

message SwimlaneMessage {
  string id = 1;
  string container_type = 2;   // Product or WorkItem
  string container_id = 3;
  string title = 4;
  string color = 5;
  double position = 6;
  int32 card_limit = 7;        // 0 = no limit
  bool is_done = 8;
  bool is_archived = 9;
  int32 card_count = 10;
  string created_at = 11;
  string updated_at = 12;
}

// ═══════════════════════════════════════════════════════════════════════════════
// SWIMLANE TRANSITION RULES
// ═══════════════════════════════════════════════════════════════════════════════

message GetSwimlaneTransitionMatrixRequest {
  string product_id = 1;
  string user_id = 2;
}

message GetSwimlaneTransitionMatrixResponse {
  bool success = 1;
  string error_message = 2;
  repeated SwimlaneTransitionRuleMessage rules = 3;
}

message SetSwimlaneTransitionMatrixRequest {
  string product_id = 1;
  string user_id = 2;
  repeated SetTransitionRuleMessage rules = 3;
}

message SetSwimlaneTransitionMatrixResponse {
  bool success = 1;
  string error_message = 2;
  repeated SwimlaneTransitionRuleMessage rules = 3;
}

message SwimlaneTransitionRuleMessage {
  string id = 1;
  string product_id = 2;
  string from_swimlane_id = 3;
  string to_swimlane_id = 4;
  bool is_allowed = 5;
  string created_at = 6;
}

message SetTransitionRuleMessage {
  string from_swimlane_id = 1;
  string to_swimlane_id = 2;
  bool is_allowed = 3;
}

// ═══════════════════════════════════════════════════════════════════════════════
// WORK ITEMS
// ═══════════════════════════════════════════════════════════════════════════════

message CreateWorkItemRequest {
  string swimlane_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;         // None, Low, Medium, High, Urgent
  string start_date = 6;       // ISO 8601 timestamp or empty
  string due_date = 7;         // ISO 8601 timestamp or empty
  int32 story_points = 8;
  repeated string assignee_ids = 9;
  repeated string label_ids = 10;
}

message WorkItemResponse {
  bool success = 1;
  string error_message = 2;
  WorkItemMessage work_item = 3;
}

message GetWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message ListWorkItemsRequest {
  string swimlane_id = 1;
  string user_id = 2;
}

message ListWorkItemsResponse {
  bool success = 1;
  string error_message = 2;
  repeated WorkItemMessage work_items = 3;
}

message GetWorkItemByNumberRequest {
  string product_id = 1;
  int32 item_number = 2;
  string user_id = 3;
}

message CreateEpicRequest {
  string swimlane_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string start_date = 6;
  string due_date = 7;
  int32 story_points = 8;
  repeated string assignee_ids = 9;
  repeated string label_ids = 10;
}

message CreateFeatureRequest {
  string swimlane_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string start_date = 6;
  string due_date = 7;
  int32 story_points = 8;
  repeated string assignee_ids = 9;
  repeated string label_ids = 10;
}

message CreateItemRequest {
  string swimlane_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string start_date = 6;
  string due_date = 7;
  int32 story_points = 8;
  repeated string assignee_ids = 9;
  repeated string label_ids = 10;
}

message CreateSubItemRequest {
  string parent_item_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string start_date = 6;
  string due_date = 7;
  int32 story_points = 8;
  repeated string assignee_ids = 9;
  repeated string label_ids = 10;
}

message UpdateWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string start_date = 6;
  string due_date = 7;
  int32 story_points = 8;
  bool is_archived = 9;
  string milestone_id = 10;
  string etag = 11;
}

message DeleteWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message MoveWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
  string target_swimlane_id = 3;
  double position = 4;
  bool enforce_wip_limit = 5;
}

message GetChildWorkItemsRequest {
  string parent_work_item_id = 1;
  string user_id = 2;
}

message ListDeletedWorkItemsRequest {
  string product_id = 1;
  string user_id = 2;
}

message RestoreWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message PermanentDeleteWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message EmptyWorkItemTrashRequest {
  string product_id = 1;
  string user_id = 2;
}

message EmptyWorkItemTrashResponse {
  bool success = 1;
  string error_message = 2;
  int32 deleted_count = 3;
}

message WorkItemMessage {
  string id = 1;
  string product_id = 2;
  string parent_work_item_id = 3;
  string type = 4;             // Epic, Feature, Item, SubItem
  string swimlane_id = 5;
  string swimlane_title = 6;
  int32 item_number = 7;
  string title = 8;
  string description = 9;
  double position = 10;
  string priority = 11;
  string start_date = 12;
  string due_date = 13;
  int32 story_points = 14;
  bool is_archived = 15;
  int32 comment_count = 16;
  int32 attachment_count = 17;
  string sprint_id = 18;
  string sprint_title = 19;
  int32 total_tracked_minutes = 20;
  string milestone_id = 21;
  string milestone_title = 22;
  string etag = 23;
  string created_by_user_id = 24;
  string created_at = 25;
  string updated_at = 26;
  string deleted_at = 27;
  string deleted_by_user_id = 28;
  string deleted_by_display_name = 29;
  repeated WorkItemAssignmentMessage assignments = 30;
  repeated LabelMessage labels = 31;
  repeated WorkItemMessage child_work_items = 32;
  repeated ChecklistMessage checklists = 33;
  repeated WorkItemFieldValueMessage custom_fields = 34;
}

message WorkItemAssignmentMessage {
  string user_id = 1;
  string display_name = 2;
  string assigned_at = 3;
}

message WorkItemFieldValueMessage {
  string id = 1;
  string work_item_id = 2;
  string custom_field_id = 3;
  string custom_field_name = 4;
  string field_type = 5;       // Text, Number, Date, SingleSelect, MultiSelect, User
  string value = 6;
  string updated_at = 7;
}

// ═══════════════════════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════════════════════

message ExportWorkItemsCsvRequest {
  string product_id = 1;
  string user_id = 2;
  string swimlane_id = 3;      // optional
  string label_id = 4;         // optional
  string priority = 5;         // optional filter
}

message ExportWorkItemsCsvResponse {
  bool success = 1;
  string error_message = 2;
  bytes csv_data = 3;
}

// ═══════════════════════════════════════════════════════════════════════════════
// WATCHERS
// ═══════════════════════════════════════════════════════════════════════════════

message GetWatchersRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message GetWatchersResponse {
  bool success = 1;
  string error_message = 2;
  repeated string watcher_user_ids = 3;
}

message WatchWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message UnwatchWorkItemRequest {
  string work_item_id = 1;
  string user_id = 2;
}

message WatchCountResponse {
  bool success = 1;
  string error_message = 2;
  int32 count = 3;
}

// ═══════════════════════════════════════════════════════════════════════════════
// ASSIGNMENTS
// ═══════════════════════════════════════════════════════════════════════════════

