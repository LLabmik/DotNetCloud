// ═══════════════════════════════════════════════════════════════════════════════

message ListProductWebhooksRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListProductWebhooksResponse {
  bool success = 1;
  string error_message = 2;
  repeated WebhookSubscriptionMessage subscriptions = 3;
}

message CreateProductWebhookRequest {
  string product_id = 1;
  string user_id = 2;
  string url = 3;
  repeated string event_types = 4;
}

message WebhookSubscriptionResponse {
  bool success = 1;
  string error_message = 2;
  WebhookSubscriptionMessage subscription = 3;
}

message UpdateProductWebhookRequest {
  string product_id = 1;
  string subscription_id = 2;
  string user_id = 3;
  string url = 4;
  repeated string event_types = 5;
  bool is_active = 6;
}

message DeleteProductWebhookRequest {
  string product_id = 1;
  string subscription_id = 2;
  string user_id = 3;
}

message TestProductWebhookRequest {
  string product_id = 1;
  string subscription_id = 2;
  string user_id = 3;
}

message TestProductWebhookResponse {
  bool success = 1;
  string error_message = 2;
  bool delivery_success = 3;
  int32 status_code = 4;
  int64 duration_ms = 5;
  string error = 6;
}

message WebhookSubscriptionMessage {
  string id = 1;
  string product_id = 2;
  string url = 3;
  string events_json = 4;     // JSON array of event type strings
  bool is_active = 5;
  string created_by_user_id = 6;
  string last_delivery_at = 7;
  int32 failed_delivery_count = 8;
  string created_at = 9;
  string updated_at = 10;
}

// ═══════════════════════════════════════════════════════════════════════════════
// ROADMAP
// ═══════════════════════════════════════════════════════════════════════════════

message GetRoadmapDataRequest {
  string product_id = 1;
  string user_id = 2;
}

message RoadmapDataResponse {
  bool success = 1;
  string error_message = 2;
  RoadmapDataMessage roadmap = 3;
}

message RoadmapDataMessage {
  string product_id = 1;
  string product_name = 2;
  repeated RoadmapItemMessage items = 3;
  repeated MilestoneMessage milestones = 4;
}

message RoadmapItemMessage {
  string id = 1;
  int32 item_number = 2;
  string title = 3;
  string type = 4;
  string priority = 5;
  string swimlane_title = 6;
  string swimlane_color = 7;
  string start_date = 8;
  string due_date = 9;
  string milestone_id = 10;
  string milestone_title = 11;
  repeated string dependency_ids = 12;
  string assignee_user_id = 13;
  string assignee_display_name = 14;
}

message MilestoneMessage {
  string id = 1;
  string product_id = 2;
  string title = 3;
  string description = 4;
  string due_date = 5;
  string status = 6;           // Upcoming, Active, Completed
  string color = 7;
  int32 work_item_count = 8;
  int32 completed_work_item_count = 9;
  string created_at = 10;
  string updated_at = 11;
}

// ═══════════════════════════════════════════════════════════════════════════════
// AUTOMATION RULES
// ═══════════════════════════════════════════════════════════════════════════════

message ListAutomationRulesRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListAutomationRulesResponse {
  bool success = 1;
  string error_message = 2;
  repeated AutomationRuleMessage rules = 3;
}

message CreateAutomationRuleRequest {
  string product_id = 1;
  string user_id = 2;
  string name = 3;
  string trigger = 4;          // work_item_created, work_item_moved, status_changed, due_date_approaching, assigned
  string conditions_json = 5;  // JSON array of condition objects
  string actions_json = 6;     // JSON array of action objects
  bool is_active = 7;
}

message AutomationRuleResponse {
  bool success = 1;
  string error_message = 2;
  AutomationRuleMessage rule = 3;
}

message UpdateAutomationRuleRequest {
  string rule_id = 1;
  string user_id = 2;
  string name = 3;
  string trigger = 4;
  string conditions_json = 5;
  string actions_json = 6;
  bool is_active = 7;
}

message DeleteAutomationRuleRequest {
  string rule_id = 1;
  string user_id = 2;
}

message AutomationRuleMessage {
  string id = 1;
  string product_id = 2;
  string name = 3;
  string trigger = 4;
  string conditions_json = 5;
  string actions_json = 6;
  bool is_active = 7;
  string created_by_user_id = 8;
  string last_triggered_at = 9;
  string created_at = 10;
  string updated_at = 11;
}

// ═══════════════════════════════════════════════════════════════════════════════
// GOALS / OKRs
// ═══════════════════════════════════════════════════════════════════════════════

message ListGoalsRequest {
  string product_id = 1;
  string user_id = 2;
}

message ListGoalsResponse {
  bool success = 1;
  string error_message = 2;
  repeated GoalMessage goals = 3;
}

message GetGoalRequest {
  string goal_id = 1;
  string user_id = 2;
}

message GoalResponse {
  bool success = 1;
  string error_message = 2;
  GoalMessage goal = 3;
}

message CreateGoalRequest {
  string product_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string type = 5;             // "objective" or "key_result"
  string parent_goal_id = 6;
  double target_value = 7;
  string progress_type = 8;    // "manual" or "automatic"
  string due_date = 9;
}

message UpdateGoalRequest {
  string goal_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  double target_value = 5;
  double current_value = 6;
  string progress_type = 7;
  string status = 8;           // NotStarted, OnTrack, AtRisk, Behind, Completed
  string due_date = 9;
}

message DeleteGoalRequest {
  string goal_id = 1;
  string user_id = 2;
}

message LinkGoalWorkItemRequest {
  string goal_id = 1;
  string user_id = 2;
  string work_item_id = 3;
}

message UnlinkGoalWorkItemRequest {
  string goal_id = 1;
  string user_id = 2;
  string work_item_id = 3;
}

message GoalMessage {
  string id = 1;
  string product_id = 2;
  string title = 3;
  string description = 4;
  string type = 5;
  string parent_goal_id = 6;
  double target_value = 7;
  double current_value = 8;
  string progress_type = 9;
  string status = 10;
  string due_date = 11;
  string created_by_user_id = 12;
  int32 linked_work_item_count = 13;
  int32 completed_linked_work_item_count = 14;
  double progress_percent = 15;
  string created_at = 16;
  string updated_at = 17;
}

// ═══════════════════════════════════════════════════════════════════════════════
// CAPACITY
// ═══════════════════════════════════════════════════════════════════════════════

message GetProductCapacityRequest {
  string product_id = 1;
  string user_id = 2;
}

message ProductCapacityResponse {
  bool success = 1;
  string error_message = 2;
  ProductCapacityMessage capacity = 3;
}

message ProductCapacityMessage {
  string product_id = 1;
  repeated MemberCapacityMessage members = 2;
  int32 total_assigned_story_points = 3;
  int32 total_members = 4;
  int32 overloaded_members = 5;
}

message MemberCapacityMessage {
  string user_id = 1;
  string display_name = 2;
  int32 assigned_story_points = 3;
  int32 assigned_item_count = 4;
  double capacity_percent = 5;  // -1 = no target set, 0-200 = percentage
  repeated string sprint_titles = 6;
}

message GetSprintCapacityRequest {
  string sprint_id = 1;
  string user_id = 2;
}

message SprintCapacityResponse {
  bool success = 1;
  string error_message = 2;
  SprintCapacityMessage capacity = 3;
}

message SprintCapacityMessage {
  string sprint_id = 1;
  string sprint_title = 2;
  int32 total_story_points = 3;
  int32 target_story_points = 4;
  int32 completed_story_points = 5;
}

// ═══════════════════════════════════════════════════════════════════════════════
// SEARCH INTEGRATION
// ═══════════════════════════════════════════════════════════════════════════════

message GetSearchableDocumentsRequest {
  string user_id = 1;
}

message GetSearchableDocumentRequest {
  string entity_id = 1;
}

message SearchableDocumentResponse {
  bool found = 1;
  SearchableDocument document = 2;
}

message SearchableDocument {
  string module_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  string title = 4;
  string content = 5;
  string summary = 6;
  string owner_id = 7;
  string organization_id = 8;
  string created_at = 9;
  string updated_at = 10;
  map<string, string> metadata = 11;
}
