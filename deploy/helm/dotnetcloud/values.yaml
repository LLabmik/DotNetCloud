# DotNetCloud Helm Chart — Default Values
# Override these in your values.yaml or with --set flags.

# ── Image ─────────────────────────────────────────────────────────────────────

image:
  repository: ghcr.io/llabmik/dotnetcloud
  tag: "" # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Replicas & Strategy ───────────────────────────────────────────────────────

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── Service ───────────────────────────────────────────────────────────────────

service:
  type: ClusterIP
  port: 8080

# ── Ingress ───────────────────────────────────────────────────────────────────

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "512m"
  hosts:
    - host: cloud.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: dotnetcloud-tls
    #   hosts:
    #     - cloud.example.com

# ── Environment ───────────────────────────────────────────────────────────────

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  # HTTPS-native: internal loopback clients hardcode https://localhost:5443; the
  # image bakes a self-signed cert into /app/certs and the container trust store.
  Kestrel__EnableHttps: "true"
  Kestrel__HttpPort: "8080"
  Kestrel__HttpsPort: "5443"
  Kestrel__CertificatePath: /app/certs/dotnetcloud-localhost.pfx
  # Allow probes by pod IP. The committed appsettings.json AllowedHosts list is
  # host-specific (localhost/mint22/…); k8s health probes use the pod IP as the
  # Host header and would get HTTP 400. Host filtering happens at the ingress.
  AllowedHosts: "*"
  # Shared data dir (mounted at /app/data) so Core + module hosts share one Data
  # Protection key ring; otherwise module hosts can't decrypt Core's auth cookie.
  DOTNETCLOUD_DATA_DIR: "/app/data"

# ── Database ──────────────────────────────────────────────────────────────────
# provider: "postgresql" (default) or "sqlserver".
database:
  provider: postgresql

  # PostgreSQL (used when provider=postgresql).
  postgresql:
    # When enabled (default), the chart deploys a self-contained PostgreSQL
    # Deployment + Service + PVC named "<release>-dotnetcloud-postgresql".
    # Set to false and supply externalConnectionString to use a managed/external DB.
    enabled: true
    image: postgres:16-alpine
    auth:
      username: dotnetcloud
      # Default dev password — override for production (values file or --set).
      password: dotnetcloud
      database: dotnetcloud
    persistence:
      enabled: true
      storageClass: ""
      size: 8Gi
    # External PostgreSQL connection string (used when postgresql.enabled=false).
    externalConnectionString: ""

  # SQL Server (used when provider=sqlserver; external only — no bundled instance).
  sqlserver:
    enabled: false
    externalConnectionString: ""

# ── Storage ───────────────────────────────────────────────────────────────────

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce

  data:
    size: 50Gi

  logs:
    size: 1Gi

# ── Module Hosts ──────────────────────────────────────────────────────────────
# Modules are NOT separate pods. Each module host (dotnetcloud.files,
# dotnetcloud.chat, dotnetcloud.tracks, …) ships inside the image under
# /app/modules and is spawned by the core ProcessSupervisor as a child process
# in the SAME pod, talking gRPC over localhost TCP. No per-module resources are
# needed here — the core Deployment runs them.

# ── Health Checks ─────────────────────────────────────────────────────────────

healthCheck:
  # Generous thresholds: first boot applies DB migrations and starts all module
  # hosts before /health/live answers, which can exceed default probe timeouts
  # (a liveness kill mid-migration causes restart loops on fresh installs).
  liveness:
    path: /health/live
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    path: /health/ready
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# ── Resources ─────────────────────────────────────────────────────────────────

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# ── Service Account ──────────────────────────────────────────────────────────

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ── Pod Configuration ────────────────────────────────────────────────────────

podAnnotations: {}
# The container runs as the base image's unprivileged 'app' user (uid/gid 1654).
podSecurityContext:
  fsGroup: 1654

securityContext:
  runAsNonRoot: true
  runAsUser: 1654
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# ── Observability ─────────────────────────────────────────────────────────────

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
