name: Publish Module SDK

# Publishes DotNetCloud.Modules.Sdk to GitHub Packages (NuGet).
#
# The SDK is the supported way to build a process-isolated module, so it must be installable with a
# single command by anyone outside this repository. GitHub Packages keeps the feed next to the code
# and avoids a NuGet.org dependency while the platform is pre-1.0.
#
# Trigger: a `sdk-v*` tag (for example `sdk-v0.7.0`) or a manual run.

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/SDK/DotNetCloud.Modules.Sdk/DotNetCloud.Modules.Sdk.csproj

      - name: Build
        run: dotnet build src/SDK/DotNetCloud.Modules.Sdk/DotNetCloud.Modules.Sdk.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/DotNetCloud.Modules.Sdk.Tests/DotNetCloud.Modules.Sdk.Tests.csproj -c Release

      - name: Pack
        run: >
          dotnet pack src/SDK/DotNetCloud.Modules.Sdk/DotNetCloud.Modules.Sdk.csproj
          -c Release --no-build -o artifacts/sdk

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "artifacts/sdk/*.nupkg"
          --source "https://nuget.pkg.github.com/LLabmik/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
