# =============================================================================
# DotNetCloud — Release Pipeline
# =============================================================================
# Triggered when a version tag (v*) is pushed. Gitea mirrors to GitHub and
# pushes tags, which triggers this workflow automatically.
#
# What it does:
#   1. Build + test the full solution
#   2. Publish self-contained linux-x64 binaries (CLI, Core.Server, module hosts)
#   3. Package into dotnetcloud-{VERSION}-linux-x64.tar.gz
#   4. Build desktop client installer bundles (linux-x64 tar.gz, win-x64 zip)
#   5. Generate SHA256 checksums for all release artifacts
#   6. Create a GitHub Release with artifacts attached
#
# The install script (tools/install.sh) downloads the tarball from the
# GitHub Release created by this workflow.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # Setup
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${TAG}"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload restore DotNetCloud.sln

      # ------------------------------------------------------------------
      # Build & Test (uses CI solution filter — excludes Android/MAUI
      # projects that require the Android SDK not present on runners)
      # ------------------------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore DotNetCloud.CI.slnf

      - name: Build
        run: dotnet build DotNetCloud.CI.slnf --configuration Release

      - name: Test
        run: dotnet test DotNetCloud.CI.slnf --no-build --configuration Release --verbosity normal --settings .runsettings

      # ------------------------------------------------------------------
      # Publish framework-dependent linux-x64 binaries
      # ------------------------------------------------------------------
      - name: Publish CLI
        run: |
          dotnet publish src/CLI/DotNetCloud.CLI/DotNetCloud.CLI.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.version }} \
            --output artifacts/publish/cli

      - name: Publish Core Server
        run: |
          dotnet publish src/Core/DotNetCloud.Core.Server/DotNetCloud.Core.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.version }} \
            --output artifacts/publish/server

      - name: Publish module hosts
        run: |
          for host_csproj in \
            src/Modules/Contacts/DotNetCloud.Modules.Contacts.Host/DotNetCloud.Modules.Contacts.Host.csproj \
            src/Modules/Calendar/DotNetCloud.Modules.Calendar.Host/DotNetCloud.Modules.Calendar.Host.csproj \
            src/Modules/Chat/DotNetCloud.Modules.Chat.Host/DotNetCloud.Modules.Chat.Host.csproj \
            src/Modules/Files/DotNetCloud.Modules.Files.Host/DotNetCloud.Modules.Files.Host.csproj \
            src/Modules/Notes/DotNetCloud.Modules.Notes.Host/DotNetCloud.Modules.Notes.Host.csproj \
            src/Modules/Tracks/DotNetCloud.Modules.Tracks.Host/DotNetCloud.Modules.Tracks.Host.csproj \
            src/Modules/Music/DotNetCloud.Modules.Music.Host/DotNetCloud.Modules.Music.Host.csproj \
            src/Modules/Photos/DotNetCloud.Modules.Photos.Host/DotNetCloud.Modules.Photos.Host.csproj \
            src/Modules/Video/DotNetCloud.Modules.Video.Host/DotNetCloud.Modules.Video.Host.csproj \
            src/Core/DotNetCloud.Core.Search.Extraction.Host/DotNetCloud.Core.Search.Extraction.Host.csproj \
            src/Modules/Bookmarks/DotNetCloud.Modules.Bookmarks.Host/DotNetCloud.Modules.Bookmarks.Host.csproj \
            src/Modules/Email/DotNetCloud.Modules.Email.Host/DotNetCloud.Modules.Email.Host.csproj \
            src/Modules/About/DotNetCloud.Modules.About.Host/DotNetCloud.Modules.About.Host.csproj \
            src/Modules/AI/DotNetCloud.Modules.AI.Host/DotNetCloud.Modules.AI.Host.csproj; do

            # Module ID = full AssemblyName (e.g. "dotnetcloud.files"). The
            # directory name must match the host executable/DLL name so the
            # server's ModuleDiscoveryService (expects <dir>/<dir>.dll) finds it.
            MODULE_NAME=$(grep -oP '(?<=<AssemblyName>)[^<]+' "$host_csproj" | head -n1 || true)
            if [ -z "$MODULE_NAME" ]; then
              # Fallback: derive the full module ID from the module directory.
              MODULE_NAME="dotnetcloud.$(echo "$host_csproj" | cut -d/ -f3 | tr '[:upper:]' '[:lower:]')"
            fi

            echo "Publishing module: ${MODULE_NAME}"
            dotnet publish "$host_csproj" \
              --configuration Release \
              --runtime linux-x64 \
              --self-contained false \
              -p:Version=${{ steps.version.outputs.version }} \
              --output "artifacts/publish/modules/${MODULE_NAME}"
          done

      # ------------------------------------------------------------------
      # Package tarball
      # ------------------------------------------------------------------
      - name: Create release tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="artifacts/staging/dotnetcloud-${VERSION}-linux-x64"
          mkdir -p "${STAGING}/server"
          mkdir -p "${STAGING}/modules"

          # CLI (framework-dependent) → root of install dir.
          cp -r artifacts/publish/cli/* "${STAGING}/"
          chmod +x "${STAGING}/dotnetcloud"

          # Core Server (framework-dependent) → server/ subdirectory.
          cp -r artifacts/publish/server/* "${STAGING}/server/"
          chmod +x "${STAGING}/server/DotNetCloud.Core.Server"

          # Module hosts → modules/{name}/ subdirectories
          for module_dir in artifacts/publish/modules/*/; do
            MODULE_NAME=$(basename "$module_dir")
            cp -r "$module_dir" "${STAGING}/modules/${MODULE_NAME}"
            # Make the module host executable
            find "${STAGING}/modules/${MODULE_NAME}" -maxdepth 1 -name "dotnetcloud.*" -type f ! -name "*.dll" ! -name "*.json" ! -name "*.xml" ! -name "*.pdb" -exec chmod +x {} \;
          done

          # Include install metadata
          echo "${VERSION}" > "${STAGING}/VERSION"

          # Create tarball
          TARBALL="artifacts/dotnetcloud-${VERSION}-linux-x64.tar.gz"
          tar -czf "$TARBALL" -C artifacts/staging "dotnetcloud-${VERSION}-linux-x64"

          echo "tarball=${TARBALL}" >> "$GITHUB_ENV"
          echo "tarball_name=dotnetcloud-${VERSION}-linux-x64.tar.gz" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Build desktop client installers (self-contained)
      # ------------------------------------------------------------------
      - name: Build desktop client installer bundles
        shell: pwsh
        run: |
          ./tools/packaging/build-desktop-client-bundles.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Configuration "Release" `
            -OutputDir "./artifacts/installers"

      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build desktop client .deb package
        run: |
          ./tools/packaging/build-desktop-client-deb.sh \
            "${{ steps.version.outputs.version }}" \
            "Release" \
            "./artifacts/installers"

      - name: Build desktop client AppImage
        run: |
          ./tools/packaging/build-desktop-client-appimage.sh \
            "${{ steps.version.outputs.version }}" \
            "Release" \
            "./artifacts/installers"

      - name: Build desktop client RPM package
        run: |
          ./tools/packaging/build-desktop-client-rpm.sh \
            "${{ steps.version.outputs.version }}" \
            "Release" \
            "./artifacts/installers"

      - name: Compute RPM filename version
        run: |
          # RPM filenames cannot contain hyphens; map 0.1.0-alpha -> 0.1.0~alpha
          VERSION="${{ steps.version.outputs.version }}"
          echo "rpm_version=${VERSION//-/~}" >> "$GITHUB_ENV"

      - name: Generate SHA256 checksum
        run: |
          cd artifacts
          sha256sum "$(basename "${{ env.tarball }}")" > "$(basename "${{ env.tarball }}").sha256"
          echo "Checksum:"
          cat "$(basename "${{ env.tarball }}").sha256"

          cd installers
          for file in \
            dotnetcloud-desktop-client-linux-x64-${{ steps.version.outputs.version }}.tar.gz \
            dotnetcloud-desktop-client-win-x64-${{ steps.version.outputs.version }}.zip \
            dotnetcloud-sync-tray_${{ steps.version.outputs.version }}_amd64.deb \
            DotNetCloud_Sync_Client-${{ steps.version.outputs.version }}-x86_64.AppImage \
            dotnetcloud-sync-tray-${{ env.rpm_version }}-1.x86_64.rpm; do
            sha256sum "$file" > "$file.sha256"
          done

      # ------------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DotNetCloud ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            ${{ env.tarball }}
            ${{ env.tarball }}.sha256
            artifacts/installers/dotnetcloud-desktop-client-linux-x64-${{ steps.version.outputs.version }}.tar.gz
            artifacts/installers/dotnetcloud-desktop-client-linux-x64-${{ steps.version.outputs.version }}.tar.gz.sha256
            artifacts/installers/dotnetcloud-desktop-client-win-x64-${{ steps.version.outputs.version }}.zip
            artifacts/installers/dotnetcloud-desktop-client-win-x64-${{ steps.version.outputs.version }}.zip.sha256
            artifacts/installers/dotnetcloud-sync-tray_${{ steps.version.outputs.version }}_amd64.deb
            artifacts/installers/dotnetcloud-sync-tray_${{ steps.version.outputs.version }}_amd64.deb.sha256
            artifacts/installers/DotNetCloud_Sync_Client-${{ steps.version.outputs.version }}-x86_64.AppImage
            artifacts/installers/DotNetCloud_Sync_Client-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256
            artifacts/installers/dotnetcloud-sync-tray-${{ env.rpm_version }}-1.x86_64.rpm
            artifacts/installers/dotnetcloud-sync-tray-${{ env.rpm_version }}-1.x86_64.rpm.sha256
