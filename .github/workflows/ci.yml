# =============================================================================
# DotNetCloud — CI Pipeline
# =============================================================================
# Runs on every push to main and on pull requests.
# Builds the full solution and runs all tests.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for committed third-party API keys
        run: ./scripts/check-third-party-keys.sh .

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload restore DotNetCloud.sln

      - name: Restore dependencies
        run: dotnet restore DotNetCloud.CI.slnf

      - name: Build
        run: dotnet build DotNetCloud.CI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test DotNetCloud.CI.slnf --no-build --configuration Release --verbosity normal --settings .runsettings

  # ===========================================================================
  # Browser Extension (npm)
  #   Verifies the lockfile installs cleanly and the extension typechecks,
  #   tests and builds. Guards against lockfile corruption (e.g. truncated
  #   integrity hashes) which previously slipped through because no CI job
  #   exercised the npm toolchain.
  # ===========================================================================
  browser-extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/Clients/DotNetCloud.Client.BrowserExtension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: src/Clients/DotNetCloud.Client.BrowserExtension/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

  # ===========================================================================
  # Module package fixture (B1)
  #   Packs the Example module as a .dncpkg, signs it with an ephemeral key,
  #   verifies it, and stores the artifact. This is the fixture the installer
  #   tests (B3) will consume, and it fails the build if the package format
  #   regresses (nondeterminism, archive safety, manifest validation).
  #
  #   The packer is `dotnetcloud module pack` — a verb of the platform CLI, not a
  #   separate tool. Packing publishes the module host, which resolves the sealed
  #   contracts from the SDK feed, so the feed is packed first.
  # ===========================================================================
  module-package:
    name: Module Package Fixture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack the module SDK feed
        shell: pwsh
        run: ./scripts/pack-module-sdk.ps1 -Output .sdk-feed

      - name: Restore dependencies
        run: dotnet restore src/CLI/DotNetCloud.CLI/DotNetCloud.CLI.csproj

      - name: Build the CLI
        run: dotnet build src/CLI/DotNetCloud.CLI/DotNetCloud.CLI.csproj --no-restore --configuration Release

      - name: Generate an ephemeral signing key
        run: |
          dotnet src/CLI/DotNetCloud.CLI/bin/Release/net10.0/dotnetcloud.dll \
            module keygen --key-id ci-ephemeral --output "${RUNNER_TEMP}/ci.key.json"

      - name: Pack the Example module
        run: |
          # The package file name must carry the manifest version: the packer verifies its own
          # output and rejects a package whose name does not match manifest.json
          # (MANIFEST_MISMATCH). Read the version instead of hard-coding it, so bumping the
          # Example module does not break this job.
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' src/Modules/Example/manifest.json)"
          if [ -z "${version}" ] || [ "${version}" = "None" ]; then
            echo "::error::Could not read .version from src/Modules/Example/manifest.json"
            exit 1
          fi

          package="${RUNNER_TEMP}/package/dotnetcloud.example-${version}.dncpkg"
          echo "EXAMPLE_PACKAGE=${package}" >> "${GITHUB_ENV}"

          dotnet src/CLI/DotNetCloud.CLI/bin/Release/net10.0/dotnetcloud.dll module pack \
            --project src/Modules/Example/DotNetCloud.Modules.Example.Host/DotNetCloud.Modules.Example.Host.csproj \
            --rid linux-x64 \
            --sign-key "${RUNNER_TEMP}/ci.key.json" \
            --output "${package}" \
            --feed "${RUNNER_TEMP}/feed"

      - name: Verify the package independently
        run: |
          dotnet src/CLI/DotNetCloud.CLI/bin/Release/net10.0/dotnetcloud.dll module verify \
            "${EXAMPLE_PACKAGE}" \
            --key-file "${RUNNER_TEMP}/ci.key.json"

      - name: Inspect the package
        run: |
          dotnet src/CLI/DotNetCloud.CLI/bin/Release/net10.0/dotnetcloud.dll module inspect \
            "${EXAMPLE_PACKAGE}"

      - name: Upload package + local feed
        uses: actions/upload-artifact@v4
        with:
          name: example-module-package
          path: |
            ${{ runner.temp }}/package/*.dncpkg
            ${{ runner.temp }}/package/*.sig
            ${{ runner.temp }}/feed/index.json
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Optional modules (dotnetcloud.ai, .bookmarks, .email, .example, .photos, .tracks)
  #   Builds and tests the six optional modules the way a third party consumes the
  #   platform: against the contract packages, never a project reference. This is
  #   what keeps co-location from eroding the published contract. Needs the SDK
  #   feed, so it does not run as part of DotNetCloud.CI.slnf.
  # ===========================================================================
  optional-modules:
    name: Optional Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack the module SDK feed
        shell: pwsh
        run: ./scripts/pack-module-sdk.ps1 -Output .sdk-feed

      - name: Restore
        run: dotnet restore DotNetCloud.Modules.slnf

      - name: Build
        run: dotnet build DotNetCloud.Modules.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test DotNetCloud.Modules.slnf --no-build --configuration Release --verbosity normal --settings .runsettings
