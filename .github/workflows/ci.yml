# =============================================================================
# DotNetCloud — CI Pipeline
# =============================================================================
# Runs on every push to main and on pull requests.
# Builds the full solution and runs all tests.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for committed third-party API keys
        run: ./scripts/check-third-party-keys.sh .

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload restore DotNetCloud.sln

      - name: Restore dependencies
        run: dotnet restore DotNetCloud.CI.slnf

      - name: Build
        run: dotnet build DotNetCloud.CI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test DotNetCloud.CI.slnf --no-build --configuration Release --verbosity normal --settings .runsettings

  # ===========================================================================
  # Browser Extension (npm)
  #   Verifies the lockfile installs cleanly and the extension typechecks,
  #   tests and builds. Guards against lockfile corruption (e.g. truncated
  #   integrity hashes) which previously slipped through because no CI job
  #   exercised the npm toolchain.
  # ===========================================================================
  browser-extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/Clients/DotNetCloud.Client.BrowserExtension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: src/Clients/DotNetCloud.Client.BrowserExtension/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build
